name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  json-yaml:
    name: JSON e compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar JSON
        run: |
          set -e
          find . -name "*.json" -not -path "./.git/*" -print0 \
            | xargs -0 -n1 python3 -m json.tool > /dev/null
      - name: Validar compose.yaml (pt-BR, en, es)
        env:
          DB_USER: exampleuser
          DB_PASSWORD: examplepass
          DB_NAME: exampledb
        run: |
          set -e
          for lang in pt-BR en es; do
            echo "=== $lang ==="
            docker compose -f "starter-kit/$lang/compose.yaml" config > /dev/null
          done

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck dos hooks pre-push (pt-BR, en, es)
        run: |
          set -e
          for lang in pt-BR en es; do
            echo "=== $lang ==="
            docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 \
              "/mnt/starter-kit/$lang/scripts/hooks/pre-push"
          done

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lychee:
    name: lychee (links)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Links por tag (/tree/vX.Y.Z/) só existem depois do merge da versão;
          # são conferidos após a Release (docs/i18n/links.md do projeto do livro).
          args: >-
            --no-progress
            --exclude '/tree/v[0-9]+\.[0-9]+\.[0-9]+/'
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
