# Dependencies always in a container from day 1.
# The app goes here once there is a deploy target (see ADR-0001).
name: myproject
services:
  db:
    image: postgres:16-alpine          # pinned version, never :latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:55432:5432"         # non-default port, localhost only
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped
  api:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }  # context at the root: sees packages/
    image: ghcr.io/<user>/<project>-api:${VERSAO:-dev}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  web:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: ghcr.io/<user>/<project>-web:${VERSAO:-dev}
    ports:
      - "127.0.0.1:3101:8080"
    depends_on: [api]
    restart: unless-stopped
volumes:
  dbdata:
