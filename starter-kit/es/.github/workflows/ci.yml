name: ci
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: teste }
        # en el runner de CI el puerto estándar es seguro: la máquina es
        # desechable y aislada, sin otro proyecto que compita por el 5432
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:teste@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }      # historial completo para gitleaks
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
