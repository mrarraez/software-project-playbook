name: ci
on: [push, pull_request]
permissions:
  contents: read   # el token del CI solo lee el repositorio
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: prueba }
        # en el runner de CI el puerto estándar es seguro: la máquina es
        # desechable y aislada, sin otro proyecto que compita por el 5432
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:prueba@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }      # historial completo para gitleaks
      # Sin package-lock.json (justo después del bootstrap), los pasos de Node se omiten
      # y el paso de abajo deja el motivo en el log. Con el lockfile, vuelven a ejecutarse
      # y a reprobar el CI (lección L22: ninguna prueba que existe deja de ejecutarse en silencio).
      - if: hashFiles('package-lock.json') == ''
        run: echo "::notice::Sin package-lock.json, se omitieron lint, pruebas y audit. Vuelven a ejecutarse cuando exista el lockfile."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package-lock.json') != ''
        with: { node-version: 24, cache: npm }
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - if: hashFiles('package-lock.json') != ''
        run: npm run lint
      - if: hashFiles('package-lock.json') != ''
        run: npm test
      - if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
