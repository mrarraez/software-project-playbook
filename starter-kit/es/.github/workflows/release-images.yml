name: release-images
on:
  push:
    tags: ["v*.*.*", "!v*.*.*-m*"]  # solo tags de release; los de misión (-mN) quedan fuera
permissions:
  contents: read
  packages: write                 # permite enviar al GitHub Container Registry
jobs:
  imagenes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen en minúsculas (exigencia del container registry)
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .                          # raíz: el build ve packages/
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMG }}:${{ github.ref_name }}
            ${{ env.IMG }}:sha-${{ github.sha }}
