name: ci
on: [push, pull_request]
permissions:
  contents: read   # o token do CI só lê o repositório
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: teste }
        # no runner do CI a porta padrão é segura: a máquina é
        # descartável e isolada, sem outro projeto disputando a 5432
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:teste@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }      # histórico completo para o gitleaks
      # Sem package-lock.json (logo depois do bootstrap), os passos de Node são pulados
      # e o passo abaixo deixa o motivo no log. Com o lockfile, eles voltam a rodar
      # e a reprovar o CI (lição L22: nenhum teste que existe deixa de rodar em silêncio).
      - if: hashFiles('package-lock.json') == ''
        run: echo "::notice::Sem package-lock.json, lint, testes e audit foram pulados. Voltam a rodar quando o lockfile existir."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package-lock.json') != ''
        with: { node-version: 24, cache: npm }
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - if: hashFiles('package-lock.json') != ''
        run: npm run lint
      - if: hashFiles('package-lock.json') != ''
        run: npm test
      - if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
