name: release-images
on:
  push:
    tags: ["v*.*.*", "!v*.*.*-m*"]  # só tags de release; as de missão (-mN) ficam de fora
permissions:
  contents: read
  packages: write                 # permite enviar ao GitHub Container Registry
jobs:
  imagens:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Nome da imagem em minúsculas (exigência do registro)
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .                          # raiz: o build enxerga packages/
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMG }}:${{ github.ref_name }}
            ${{ env.IMG }}:sha-${{ github.sha }}
