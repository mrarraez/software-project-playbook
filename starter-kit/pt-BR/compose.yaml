# Dependências sempre em container desde o dia 1.
# A app entra aqui quando houver alvo de deploy (ver ADR-0001).
name: meuprojeto
services:
  db:
    image: postgres:16-alpine          # versão fixa, nunca :latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:55432:5432"         # porta não padrão e só localhost
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped
  api:
    profiles: ["app"]
    # contexto na raiz: enxerga packages/
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: ghcr.io/<usuario>/<projeto>-api:${VERSAO:-dev}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  web:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: ghcr.io/<usuario>/<projeto>-web:${VERSAO:-dev}
    ports:
      - "127.0.0.1:3101:8080"
    depends_on: [api]
    restart: unless-stopped
  proxy:
    profiles: ["app"]
    image: caddy:2.11-alpine
    environment:
      DOMINIO: ${DOMINIO:-localhost}   # na sua máquina, https://localhost
    ports:                         # as únicas portas públicas
      - "80:80"
      - "443:443"
      - "443:443/udp"              # HTTP/3
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data            # guarda os certificados
    depends_on: [api, web]
    restart: unless-stopped
volumes:
  dbdata:
  caddydata:
