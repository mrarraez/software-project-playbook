# Dependências sempre em container desde o dia 1.
# A app entra aqui quando houver alvo de deploy (ver ADR-0001).
name: meuprojeto
services:
  db:
    image: postgres:16-alpine          # versão fixa, nunca :latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:55432:5432"         # porta não padrão e só localhost
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped
volumes:
  dbdata:
